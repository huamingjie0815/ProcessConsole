[package]
name = "process-console"
version = "0.1.1"
description = "GUI for finding coding-agent-owned local servers"
authors = ["hmj"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "process_mgr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
